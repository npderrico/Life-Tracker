<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Nick's Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f5f0e8;
    --cream2: #ede7d9;
    --cream3: #e4ddd0;
    --green: #1a3d2b;
    --green2: #2a5c40;
    --green3: #3a7a56;
    --gold: #8a7340;
    --gold-light: #b09a60;
    --text: #1a3d2b;
    --muted: #5a7a65;
    --muted2: #7a9a85;
    --border: #c8bfa8;
    --border2: #b8ad98;
    --serif: 'Playfair Display', Georgia, serif;
    --body: 'EB Garamond', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--cream); color: var(--text); font-family: var(--body); font-size: 16px; min-height: 100vh; padding: 0 0 130px; }

  header { background: var(--green); padding: 18px 20px 14px; text-align: center; position: sticky; top: 0; z-index: 10; border-bottom: 3px solid var(--gold); }
  .hdr-eyebrow { font-family: var(--body); font-size: 10px; letter-spacing: 0.22em; color: var(--muted2); text-transform: uppercase; margin-bottom: 3px; font-style: italic; }
  .hdr-name { font-family: var(--serif); font-size: 24px; color: #f5f0e8; font-weight: 400; letter-spacing: 0.03em; }
  .hdr-date { font-family: var(--body); font-size: 11px; color: var(--muted2); margin-top: 4px; font-style: italic; }

  .card { margin: 16px 14px 0; border: 1px solid var(--border2); background: #faf7f0; }
  .card-header { background: var(--green); display: grid; grid-template-columns: repeat(4,1fr); }
  .sc { padding: 10px 6px 8px; text-align: center; border-right: 1px solid rgba(255,255,255,0.08); }
  .sc:last-child { border-right: none; }
  .sc-v { font-family: var(--serif); font-size: 20px; font-weight: 500; color: #f5f0e8; line-height: 1; margin-bottom: 3px; }
  .sc-v.over { color: #f0a080; }
  .sc-l { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted2); font-family: var(--body); }

  .progress-row { background: var(--cream2); padding: 7px 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .prog-lbl { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-family: var(--body); white-space: nowrap; }
  .prog-bar { flex:1; height: 3px; background: var(--border); overflow: hidden; }
  .prog-fill { height: 100%; background: var(--green3); transition: width 0.35s; width: 0%; }
  .prog-num { font-size: 10px; color: var(--muted); font-family: var(--body); white-space: nowrap; font-style: italic; }

  .section { margin: 14px 14px 0; border: 1px solid var(--border2); background: #faf7f0; }
  .sec-hdr { background: var(--green2); padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
  .sec-title { font-family: var(--serif); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--cream2); font-weight: 400; font-style: italic; }
  .chev { color: var(--muted2); font-size: 9px; transition: transform 0.2s; }
  .sec-hdr.col .chev { transform: rotate(-90deg); }
  .sec-body.hidden { display: none; }

  .food-row { display: flex; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--cream3); gap: 10px; }
  .food-row:last-child { border-bottom: none; }
  .food-info { flex:1; min-width:0; }
  .food-name { font-family: var(--body); font-size: 14px; color: var(--text); line-height: 1.2; }
  .food-sub { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 1px; }
  .food-meta { text-align: right; }
  .food-cal { font-family: var(--serif); font-size: 14px; color: var(--green); }
  .food-pro { font-size: 10px; color: var(--muted2); font-style: italic; margin-top: 1px; }

  .qty-wrap { display: flex; align-items: center; gap: 5px; }
  .qty-btn { width: 26px; height: 26px; border: 1px solid var(--border2); border-radius: 1px; background: var(--cream2); color: var(--green); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.12s; touch-action: manipulation; flex-shrink: 0; }
  .qty-btn:active { background: var(--cream3); }
  .qty-n { font-family: var(--serif); font-size: 15px; min-width: 16px; text-align: center; color: var(--muted2); }
  .qty-n.on { color: var(--green); font-weight: 600; }

  .act-row { display: flex; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--cream3); gap: 10px; cursor: pointer; }
  .act-row:last-child { border-bottom: none; }
  .act-chk { width: 16px; height: 16px; accent-color: var(--green2); cursor: pointer; flex-shrink: 0; }
  .act-info { flex:1; }
  .act-name { font-family: var(--body); font-size: 14px; color: var(--text); }
  .act-name.dim { color: var(--muted); font-style: italic; }
  .act-cal { font-family: var(--serif); font-size: 13px; color: var(--muted); }

  .custom-wrap { border-top: 1px solid var(--border); padding: 10px 12px; background: var(--cream2); }
  .custom-fields { display: flex; gap: 6px; margin-bottom: 7px; }
  .custom-fields input { background: #faf7f0; border: 1px solid var(--border2); color: var(--text); font-family: var(--body); font-size: 13px; padding: 7px 8px; outline: none; }
  .custom-fields input:focus { border-color: var(--green2); }
  .custom-fields input::placeholder { color: var(--muted2); font-style: italic; }
  .inp-name { flex:1; }
  .inp-sm { width: 56px; }
  .add-btn { width: 100%; padding: 8px; background: var(--green); border: none; color: var(--cream2); font-family: var(--body); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; font-style: italic; transition: background 0.15s; }
  .add-btn:active { background: var(--green2); }

  .reset-wrap { text-align: center; padding: 14px 0 4px; }
  .reset-btn { background: none; border: none; font-family: var(--body); font-size: 12px; color: var(--muted2); cursor: pointer; font-style: italic; text-decoration: underline; text-underline-offset: 3px; }

  .dock { position: fixed; bottom:0; left:0; right:0; background: var(--green); border-top: 2px solid var(--gold); padding: 10px 14px 24px; z-index: 20; }
  .dock-hint { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted2); font-family: var(--body); margin-bottom: 7px; font-style: italic; }
  .dock-row { display: flex; gap: 8px; align-items: flex-end; }
  .dock-input { flex:1; background: #faf7f0; border: 1px solid var(--border2); color: var(--text); font-family: var(--body); font-size: 14px; padding: 8px 11px; outline: none; resize: none; max-height: 90px; line-height: 1.4; }
  .dock-input:focus { border-color: var(--gold); }
  .dock-input::placeholder { color: var(--muted2); font-style: italic; }
  .dock-send { width: 38px; height: 38px; background: var(--gold); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; touch-action: manipulation; }
  .dock-send:active { background: var(--gold-light); }
  .dock-send svg { width: 15px; height: 15px; fill: #faf7f0; }
</style>
</head>
<body>

<header>
  <div class="hdr-eyebrow">Daily Log</div>
  <div class="hdr-name">Nick's Tracker</div>
  <div class="hdr-date" id="date-label"></div>
</header>

<div class="card">
  <div class="card-header">
    <div class="sc"><div class="sc-v" id="s-in">0</div><div class="sc-l">Eaten</div></div>
    <div class="sc"><div class="sc-v" id="s-burn">0</div><div class="sc-l">Burned</div></div>
    <div class="sc"><div class="sc-v" id="s-def">0</div><div class="sc-l">Deficit</div></div>
    <div class="sc"><div class="sc-v" id="s-pro">0g</div><div class="sc-l">Protein</div></div>
  </div>
  <div class="progress-row">
    <span class="prog-lbl">Target</span>
    <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
    <span class="prog-num" id="prog-num">0 / 500</span>
  </div>
</div>

<div class="section" id="sec-meals">
  <div class="sec-hdr" onclick="toggleSec('meals')"><span class="sec-title">Meals &amp; Food</span><span class="chev">▾</span></div>
  <div class="sec-body" id="body-meals"></div>
  <div class="custom-wrap">
    <div class="custom-fields">
      <input class="inp-name" type="text" id="c-name" placeholder="Custom item..." />
      <input class="inp-sm" type="number" id="c-cal" placeholder="cal" inputmode="numeric" />
      <input class="inp-sm" type="number" id="c-pro" placeholder="pro" inputmode="numeric" />
    </div>
    <button class="add-btn" onclick="addCustom()">Add to Card</button>
  </div>
</div>

<div class="section" id="sec-act">
  <div class="sec-hdr" onclick="toggleSec('act')"><span class="sec-title">Activity</span><span class="chev">▾</span></div>
  <div class="sec-body" id="body-act"></div>
</div>

<div class="reset-wrap"><button class="reset-btn" onclick="resetAll()">Reset today's card</button></div>

<div class="dock">
  <div class="dock-hint">Ask Claude</div>
  <div class="dock-row">
    <textarea class="dock-input" id="dock-txt" rows="1" placeholder="Add a food, adjust calories, ask anything..." oninput="autoGrow(this)" onkeydown="onKey(event)"></textarea>
    <button class="dock-send" onclick="send()" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg></button>
  </div>
</div>

<script>
const FOODS=[
  {id:'burrito',name:'Breakfast burrito',sub:'3 eggs · turkey sausage · XL tortilla',cal:730,protein:39},
  {id:'oikos',name:'Oikos Pro',sub:'vanilla',cal:130,protein:20},
  {id:'creamer',name:'Starbucks brown sugar creamer',sub:'2 tbsp',cal:80,protein:0},
  {id:'rollup',name:'Roll-up',sub:"Boar's Head maple turkey + HT cheese stick",cal:115,protein:14},
  {id:'clementine',name:'Clementine',sub:'1 piece',cal:35,protein:0},
  {id:'smoothie',name:'Smoothie',sub:'strawberries/blueberries · light OJ · Oikos Pro · banana',cal:377,protein:20},
  {id:'wf-tray',name:'Whole Foods tray',sub:'scallopini · broccoli · fingerling potatoes',cal:640,protein:50},
  {id:'scallopini',name:'Chicken scallopini',sub:'~6oz breast',cal:320,protein:40},
  {id:'pasta',name:'Pasta dinner',sub:"pasta · Newman's marinara · WF meatball",cal:555,protein:27},
  {id:'kashi',name:'Kashi Go + Fairlife',sub:'evening snack',cal:280,protein:17},
  {id:'turkey',name:'Deli turkey slices',sub:'3–4oz',cal:120,protein:22},
  {id:'sourdough',name:'Sourdough slice',sub:'100 cal / slice',cal:100,protein:3},
  {id:'cheddar',name:'Cheddar slice',sub:'1 slice',cal:110,protein:7},
  {id:'tortilla',name:'Flour tortilla',sub:'large',cal:130,protein:3},
  {id:'jerky',name:'Jerky',sub:'1 oz',cal:80,protein:10},
  {id:'sc-wrap',name:'Scallopini tortilla wrap',sub:'scallopini + cheddar + tortilla',cal:530,protein:50},
];
const ACTS=[
  {id:'tdee',name:'Base TDEE',sub:"6'2\" · 205 lbs · 27yo",cal:2900,always:true},
  {id:'bike40',name:'Bike 40 min @ 150W',cal:565},
  {id:'bike25',name:'Bike 25 min @ 150W',cal:350},
  {id:'pt30',name:'Light PT 30 min',cal:100},
  {id:'walk1',name:'Dog walk ~1 mile',cal:115},
  {id:'walk05',name:'Dog walk ~0.5 mile',cal:60},
];

let custom=[],qty={},acts={},col={};

function load(){
  const today=new Date().toDateString();
  try{const s=JSON.parse(localStorage.getItem('nt3')||'{}');if(s.date===today){qty=s.qty||{};acts=s.acts||{};custom=s.custom||[];}}catch(e){}
}
function save(){localStorage.setItem('nt3',JSON.stringify({date:new Date().toDateString(),qty,acts,custom}));}

function renderDate(){document.getElementById('date-label').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}

function renderMeals(){
  const all=[...FOODS,...custom];
  document.getElementById('body-meals').innerHTML=all.map(f=>{
    const q=qty[f.id]||0;
    return`<div class="food-row">
      <div class="qty-wrap">
        <button class="qty-btn" ontouchstart="" onclick="chQty('${f.id}',-1)">−</button>
        <span class="qty-n ${q>0?'on':''}">${q}</span>
        <button class="qty-btn" ontouchstart="" onclick="chQty('${f.id}',1)">+</button>
      </div>
      <div class="food-info"><div class="food-name">${f.name}</div>${f.sub?`<div class="food-sub">${f.sub}</div>`:''}</div>
      <div class="food-meta"><div class="food-cal">${f.cal}</div><div class="food-pro">${f.protein}g protein</div></div>
    </div>`;
  }).join('');
  update();
}

function renderActs(){
  document.getElementById('body-act').innerHTML=ACTS.map(a=>{
    const chk=a.always||acts[a.id];
    return`<div class="act-row" onclick="${a.always?'':` tAct('${a.id}')`}">
      <input class="act-chk" type="checkbox" ${chk?'checked':''} ${a.always?'disabled':''} onchange="tAct('${a.id}')" onclick="event.stopPropagation()"/>
      <div class="act-info"><div class="act-name ${a.always?'dim':''}">${a.name}</div>${a.sub?`<div class="food-sub">${a.sub}</div>`:''}</div>
      <div class="act-cal">${a.always?'':'+'}${a.cal.toLocaleString()}</div>
    </div>`;
  }).join('');
  update();
}

function chQty(id,d){qty[id]=Math.max(0,(qty[id]||0)+d);save();renderMeals();}
function tAct(id){const a=ACTS.find(x=>x.id===id);if(!a||a.always)return;acts[id]=!acts[id];save();renderActs();}

function update(){
  const all=[...FOODS,...custom];
  let cal=0,pro=0;
  all.forEach(f=>{const q=qty[f.id]||0;cal+=f.cal*q;pro+=(f.protein||0)*q;});
  let burn=0;
  ACTS.forEach(a=>{if(a.always||acts[a.id])burn+=a.cal;});
  const def=burn-cal;
  const pct=Math.min(100,Math.max(0,(def/500)*100));
  document.getElementById('s-in').textContent=cal.toLocaleString();
  document.getElementById('s-burn').textContent=burn.toLocaleString();
  const el=document.getElementById('s-def');
  el.textContent=def.toLocaleString();
  el.className='sc-v'+(def<0?' over':'');
  document.getElementById('s-pro').textContent=Math.round(pro)+'g';
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-num').textContent=def.toLocaleString()+' / 500';
}

function addCustom(){
  const name=document.getElementById('c-name').value.trim();
  const cal=parseInt(document.getElementById('c-cal').value);
  const pro=parseInt(document.getElementById('c-pro').value)||0;
  if(!name||isNaN(cal))return;
  const id='cx'+Date.now();
  custom.push({id,name,sub:'custom',cal,protein:pro});
  qty[id]=1;
  document.getElementById('c-name').value='';
  document.getElementById('c-cal').value='';
  document.getElementById('c-pro').value='';
  save();renderMeals();
}

function toggleSec(k){
  col[k]=!col[k];
  document.getElementById('body-'+k).classList.toggle('hidden',col[k]);
  document.querySelector(`#sec-${k} .sec-hdr`).classList.toggle('col',col[k]);
}

function resetAll(){if(!confirm("Reset today's card?"))return;qty={};acts={};custom=[];save();renderMeals();renderActs();}

function ctx(){
  const all=[...FOODS,...custom];
  const eaten=all.filter(f=>(qty[f.id]||0)>0).map(f=>`${qty[f.id]}x ${f.name} (${f.cal*qty[f.id]} cal, ${(f.protein||0)*qty[f.id]}g protein)`).join(', ');
  const active=ACTS.filter(a=>a.always||acts[a.id]).map(a=>`${a.name} (${a.cal} cal)`).join(', ');
  return`[Nick's tracker — ${new Date().toDateString()}]\nEaten: ${eaten||'nothing yet'}\nActivity: ${active||'none'}\nTotals: ${document.getElementById('s-in').textContent} cal in · ${document.getElementById('s-burn').textContent} burned · ${document.getElementById('s-def').textContent} deficit · ${document.getElementById('s-pro').textContent} protein\n500 cal deficit target. Stats: 6'2", 205 lbs, 27yo.\n\n`;
}

function send(){
  const msg=document.getElementById('dock-txt').value.trim();
  if(!msg)return;
  window.open('https://claude.ai/new?q='+encodeURIComponent(ctx()+msg),'_blank');
  document.getElementById('dock-txt').value='';
  document.getElementById('dock-txt').style.height='auto';
}

function autoGrow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,90)+'px';}
function onKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}}

load();renderDate();renderMeals();renderActs();
setInterval(renderDate,60000);
</script>
</body>
</html>
